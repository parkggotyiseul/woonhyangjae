# ══════════════════════════════════════════════════════════
#  운향재 — 호스트 nginx (TLS 종단 + 리버스 프록시)
#  → /etc/nginx/sites-available/woonhyangjae.com
#  실제 콘텐츠는 도커 컨테이너(127.0.0.1:8080)가 서빙한다.
# ══════════════════════════════════════════════════════════

upstream woonhyangjae_web {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ── HTTP : ACME 챌린지만 받고 나머지는 HTTPS로 ─────────────
server {
    listen 80;
    listen [::]:80;
    server_name woonhyangjae.com www.woonhyangjae.com;

    # 인증서 갱신 경로는 리다이렉트보다 먼저 매칭되어야 한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://woonhyangjae.com$request_uri;
    }
}

# ── HTTPS : www → apex 정규화 ──────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.woonhyangjae.com;

    ssl_certificate     /etc/letsencrypt/live/woonhyangjae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woonhyangjae.com/privkey.pem;
    include /etc/nginx/snippets/woonhyangjae-tls.conf;

    return 301 https://woonhyangjae.com$request_uri;
}

# ── HTTPS : 본 사이트 ──────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name woonhyangjae.com;

    ssl_certificate     /etc/letsencrypt/live/woonhyangjae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woonhyangjae.com/privkey.pem;
    include /etc/nginx/snippets/woonhyangjae-tls.conf;

    # Cloudflare 뒤이므로 실제 클라이언트 IP를 복원한다.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/woonhyangjae.access.log;
    error_log  /var/log/nginx/woonhyangjae.error.log;

    # ── 보안 헤더 ──────────────────────────────────────────
    # HSTS: 1년 + 서브도메인. Cloudflare에서도 HSTS를 켜지 말 것(중복).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # 폰트는 Google Fonts만 허용한다. 외부 스크립트는 전부 차단.
    # sha256-... 은 index.html 의 JSON-LD 블록 해시다.
    # JSON-LD 를 수정하면 반드시 다시 계산할 것: make csp-hash
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-FSFC1e/xjV8W6wqPw8RYVey4S3FWHLoc1G3Wvh4H2RY='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; form-action 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;

    client_max_body_size 4m;

    # 인증서 갱신은 HTTPS로도 들어올 수 있다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://woonhyangjae_web;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 업스트림이 잠깐 죽어도 에러 페이지 대신 재시도
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
