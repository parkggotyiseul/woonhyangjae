# 컨테이너 내부 nginx — 정적 파일만 담당한다.
# TLS, 리다이렉트, HSTS는 호스트 nginx가 처리한다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # 호스트 nginx가 넘겨준 원 클라이언트 IP를 로그에 남긴다.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── 압축 ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # ── 캐시 정책 ─────────────────────────────────────
    # HTML은 항상 재검증한다. 배포 즉시 반영되어야 하므로.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    # 정적 자산. 파일명에 해시가 없으므로 1일 + 재검증으로 잡는다.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        access_log off;
    }

    location ~* \.(svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ── 라우팅 ────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # 헬스체크 — 접근 로그에서 제외
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 숨김 파일 차단 (.git, .env 등)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
