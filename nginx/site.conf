# 컨테이너 내부 nginx — 정적 파일만 담당한다.
# TLS, 리다이렉트, HSTS는 호스트 nginx가 처리한다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # 호스트 nginx가 넘겨준 원 클라이언트 IP를 로그에 남긴다.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── 압축 ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # ── 캐시 정책 ─────────────────────────────────────
    # HTML은 항상 재검증한다. 배포 즉시 반영되어야 하므로.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    # 정적 자산. 파일명에 해시가 없으므로 1일 + 재검증으로 잡는다.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        access_log off;
    }

    location ~* \.(svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ── 라우팅 ────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── 관리자 ────────────────────────────────────────
    # 지금은 서버에 저장되는 데이터가 없어 화면만 노출되지만,
    # 실제 주문·고객 데이터가 붙기 전에 반드시 접근 제한을 걸어야 한다.
    #
    # 1) 비밀번호 파일 생성 (호스트에서):
    #      htpasswd -c /etc/nginx/.htpasswd-admin <아이디>
    # 2) docker-compose.yml 의 web 서비스 volumes 에 아래 한 줄 추가:
    #      - /etc/nginx/.htpasswd-admin:/etc/nginx/.htpasswd-admin:ro
    # 3) 아래 두 줄의 주석을 해제하고 컨테이너 재시작
    location /admin/ {
        # auth_basic           "Woonhyangjae Admin";
        # auth_basic_user_file /etc/nginx/.htpasswd-admin;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    # 장바구니·주문서·주문완료는 색인 대상이 아니다
    location ~ ^/(cart|checkout|order)\.html$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # 헬스체크 — 접근 로그에서 제외
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 숨김 파일 차단 (.git, .env 등)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
