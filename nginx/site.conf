# 컨테이너 내부 nginx — 정적 파일만 담당한다.
# TLS, 리다이렉트, HSTS는 호스트 nginx가 처리한다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # 호스트 nginx가 넘겨준 원 클라이언트 IP를 로그에 남긴다.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── 압축 ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # ── API ───────────────────────────────────────────
    # 관리자 API 는 화면과 같은 Basic 인증으로 막는다. 브라우저가 같은 realm 의
    # 자격증명을 자동으로 함께 보내므로 별도 로그인 화면이 필요 없다.
    # 인증을 nginx 한 곳에서만 관리한다는 뜻이기도 하다.
    location ^~ /api/admin/ {
        auth_basic           "Woonhyangjae Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;

        client_max_body_size 20m;      # 이미지 업로드
        proxy_pass http://api:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 공개 API — 카탈로그 조회, 주문 접수, 분석 이벤트 수집
    location ^~ /api/ {
        add_header Cache-Control "no-store" always;

        client_max_body_size 2m;
        proxy_pass http://api:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 업로드 이미지 — API 가 볼륨에 쓴 파일을 여기서 정적으로 내보낸다
    location ^~ /uploads/ {
        alias /srv/data/uploads/;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # ── 비공개 영역 ───────────────────────────────────
    # 정규식 location은 정의 순서대로 매칭되므로 아래 .html 블록보다 먼저 와야 한다.
    # try_files 내부 리다이렉트 후에도 같은 블록에 다시 걸리도록 정규식으로 잡는다.
    location ~ ^/admin/ {
        auth_basic           "Woonhyangjae Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    # 장바구니 · 주문서 · 주문완료 · 회원 화면은 색인 대상이 아니고,
    # 개인 정보가 보이는 자리라 어디에도 저장되지 않게 한다.
    location ~ ^/(cart|checkout|order|login|join|forgot|reset|account)\.html$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    # ── 캐시 정책 ─────────────────────────────────────
    # HTML은 항상 재검증한다. 배포 즉시 반영되어야 하므로.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    # 정적 자산. 파일명에 해시가 없으므로 1일 + 재검증으로 잡는다.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        access_log off;
    }

    location ~* \.(svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ── 라우팅 ────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # 헬스체크 — 접근 로그에서 제외
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 숨김 파일 차단 (.git, .env 등)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
