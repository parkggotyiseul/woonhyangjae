services:
  web:
    image: nginx:1.27-alpine
    container_name: woonhyangjae-web
    restart: unless-stopped

    # 호스트 nginx만 접근하면 되므로 루프백에만 노출한다.
    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro

    environment:
      TZ: Asia/Seoul

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
