services:
  web:
    image: nginx:1.27-alpine
    container_name: woonhyangjae-web
    restart: unless-stopped

    # 호스트 nginx만 접근하면 되므로 루프백에만 노출한다.
    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      # 관리자 Basic 인증 계정. 호스트에서 아래로 생성한다.
      #   printf 'admin:%s\n' "$(openssl passwd -apr1)" | sudo tee /etc/nginx/.htpasswd-admin
      # 파일이 없는 상태로 컨테이너를 올리면 docker 가 같은 경로에 디렉터리를
      # 만들어버려 인증이 깨지므로, 반드시 파일을 먼저 만들어야 한다.
      - /etc/nginx/.htpasswd-admin:/etc/nginx/.htpasswd-admin:ro

    environment:
      TZ: Asia/Seoul

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
